- title: Expérience
  type: time_table
  contents:
    - title: Doctorat en biophysique théorique
      institution: "<a href='https://www.phys.ens.fr/' target='_blank' rel='noopener'>Laboratoire de Physique de l'ENS (LPENS)</a>, ENS – PSL, Paris"
      year: 2023 – 2026
      description:
        - "Directeur de thèse : professeur Massimo Vergassola"
        - "Thèse soutenue le 21 septembre 2026 : <em>From pial arterioles to the small intestine: models of coupled oscillators for the study of frequency parcellation in spatially extended systems</em>."
        - Modèles d'oscillateurs couplés forcés pour la parcellisation en fréquence dans les systèmes biologiques (intestin, réseau pial) ; travail analytique et numérique.
        - Collaborations avec le Dr M. Cencini (ISC, CNR, Rome) et le groupe du professeur D. Kleinfeld (UC San Diego).
    - title: Mécanique statistique de l'augmentation de données Mixup
      institution: "<a href='https://www.epfl.ch/labs/idephics/' target='_blank' rel='noopener'>Laboratoire Information, Learning and Physics (IdePHICS)</a>, EPFL, Lausanne"
      year: 2022
      description:
        - "Encadrant : professeur Florent Krzakala"
        - Calculs de répliques et théorie des matrices aléatoires pour obtenir les erreurs de généralisation et d'apprentissage, comparées à des simulations.
    - title: Modélisation du transport intracellulaire le long des microtubules
      institution: "<a href='https://www.ijclab.in2p3.fr/' target='_blank' rel='noopener'>Laboratoire Irène Joliot-Curie (IJCLab)</a>, Orsay"
      year: 2021
      description:
        - "Encadrante : Dr Cécile Appert-Rolland"
        - Simulations Python du transport de vésicules le long des microtubules ; travail analytique avec le Dr C. Appert-Rolland et le professeur H. Hilhorst.
    - title: Montage et tests d'un banc expérimental de caloduc pulsé cryogénique
      institution: "<a href='https://www.cea.fr/' target='_blank' rel='noopener'>CEA</a>, Laboratoire de Cryogénie et Stations d'Essais, Saclay"
      year: 2019
      description:
        - "Encadrant : Dr Romain Bruce"
        - Montage du banc (soudure, thermalisation des câbles, tests d'étanchéité, capteurs) et programme LabVIEW NXG pour le pilotage des instruments.

